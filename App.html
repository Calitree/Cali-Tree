<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Calitree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── DESIGN TOKENS ────────────────────────── */
:root {
  /* Surfaces */
  --s0: #0e0e0e;
  --s1: #121212;
  --s2: #181818;
  --s3: #1e1e1e;
  --s4: #252525;
  --s5: #2d2d2d;

  /* Borders */
  --b1: rgba(255,255,255,.09);
  --b2: rgba(255,255,255,.14);
  --b3: rgba(255,255,255,.22);

  /* Text */
  --tx0: #f5f5f5;
  --tx1: #b8b8b8;
  --tx2: #707070;
  --tx3: #464646;

  /* Accent — single green */
  --a: #2ecc71;
  --a-dim: rgba(46,204,113,.12);
  --a-border: rgba(46,204,113,.28);

  /* Amber — legendary only */
  --lg: #f0a830;
  --lg-dim: rgba(232,160,32,.08);
  --lg-border: rgba(232,160,32,.2);

  /* Type */
  --f: 'Geist', -apple-system, sans-serif;
  --fm: 'Geist Mono', 'JetBrains Mono', monospace;

  /* Glow */
  --glow-a: 0 0 12px rgba(46,204,113,.15), 0 0 24px rgba(46,204,113,.06);
  --glow-lg: 0 0 12px rgba(240,168,48,.15), 0 0 24px rgba(240,168,48,.06);

  /* Radius */
  --r1: 4px;
  --r2: 6px;
  --r3: 8px;
  --r4: 12px;

  /* Layout */
  --hdr-h: 48px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--s0); color: var(--tx0); font-family: var(--f); overflow: hidden; -webkit-font-smoothing: antialiased; font-size: 13px; line-height: 1.5; }

/* ─── HEADER ────────────────────────────────── */
#hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  height: var(--hdr-h);
  background: rgba(8,8,8,.92);
  border-bottom: 1px solid var(--b1);
  backdrop-filter: blur(12px);
  display: flex; align-items: center; padding: 0 16px; gap: 0;
}
.h-brand {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--tx0);
  letter-spacing: -.01em; margin-right: 20px;
}
.h-brand-icon {
  width: 22px; height: 22px;
  background: var(--s4); border: 1px solid var(--b2);
  border-radius: var(--r1);
  display: flex; align-items: center; justify-content: center;
}
.h-divider { width: 1px; height: 16px; background: var(--b1); margin: 0 14px; flex-shrink: 0; }
.h-stat-group { display: flex; align-items: center; gap: 12px; }
.h-stat { display: flex; align-items: center; gap: 5px; }
.h-stat-val { font-family: var(--fm); font-size: 12px; color: var(--tx0); font-weight: 500; }
.h-stat-lbl { font-size: 11px; color: var(--tx2); }
.h-level {
  display: flex; align-items: center; gap: 8px;
  background: var(--s3); border: 1px solid var(--b1);
  border-radius: var(--r2); padding: 4px 10px;
}
.h-level-label { font-family: var(--fm); font-size: 10px; color: var(--tx2); letter-spacing: .06em; }
.h-level-val { font-family: var(--fm); font-size: 11px; color: var(--tx0); font-weight: 500; }
.h-xp-track { width: 48px; height: 2px; background: var(--s5); border-radius: 1px; overflow: hidden; }
.h-xp-fill { height: 100%; background: var(--a); border-radius: 1px; transition: width .4s ease; box-shadow: 0 0 6px rgba(46,204,113,.4); }
.h-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.h-username { font-family: var(--fm); font-size: 10px; color: var(--tx2); letter-spacing: .04em; }
.h-btn {
  padding: 5px 10px; border-radius: var(--r2);
  border: 1px solid var(--b1); background: transparent;
  color: var(--tx1); font-family: var(--f); font-size: 11px;
  font-weight: 500; cursor: pointer; transition: all .15s;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.h-btn:hover { border-color: var(--b2); color: var(--tx0); background: var(--s3); }
.h-btn.active { border-color: var(--b2); background: var(--s4); color: var(--tx0); }
.h-btn svg { width: 12px; height: 12px; stroke: currentColor; flex-shrink: 0; }

/* ─── CANVAS VIEWPORT ───────────────────────── */
#canvas-wrap {
  position: fixed;
  top: var(--hdr-h); left: 0; right: 0; bottom: 0;
  overflow: hidden;
  cursor: grab;
  background: var(--s0);
  touch-action: none;
  user-select: none;
}

#canvas-wrap.panning { cursor: grabbing; }
#canvas-wrap.coach-open { right: 360px; }

/* The actual canvas element must have explicit dimensions for mobile to render */
#canvas {
  position: absolute;
  top: 0; left: 0;
  width: 2700px; height: 2000px; /* generous fixed size — JS sets this */
  transform-origin: top left;
  will-change: transform;
}
#tree-svg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; overflow: visible;
}
#tree-nodes { position: absolute; top: 0; left: 0; }

/* ─── NODES ─────────────────────────────────── */
.node {
  position: absolute;
  width: 116px; height: 60px;
  border-radius: var(--r2);
  border: 1px solid var(--b2);
  background: var(--s2);
  padding: 9px 11px 8px;
  display: flex; flex-direction: column;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .1s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.node:active { transform: scale(0.97); }
.node.locked { opacity: .5; cursor: pointer; }
.node.locked:hover { border-color: var(--b2); opacity: .65; }
.node.available { background: var(--s3); border-color: var(--b2); }
.node.available:hover { border-color: var(--b3); background: var(--s4); transform: translateY(-1px); box-shadow: 0 0 10px rgba(255,255,255,.04); }
.node.completed { background: var(--a-dim); border-color: var(--a-border); box-shadow: var(--glow-a); }
.node.completed:hover { border-color: rgba(34,197,94,.35); transform: translateY(-1px); }
.node.legendary.available { background: var(--lg-dim); border-color: var(--lg-border); }
.node.legendary.available:hover { border-color: rgba(232,160,32,.35); }
.node.legendary.completed { background: rgba(240,168,48,.07); border-color: var(--lg-border); box-shadow: var(--glow-lg); }
.node.legendary.completed:hover { border-color: rgba(232,160,32,.35); }

.node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.node-cat { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.node-badge {
  font-family: var(--fm); font-size: 8px; font-weight: 500;
  letter-spacing: .04em; color: var(--tx3);
}
.node.available .node-badge { color: var(--tx2); }
.node.completed .node-badge { color: rgba(34,197,94,.5); }
.node.legendary.available .node-badge,
.node.legendary.completed .node-badge { color: rgba(232,160,32,.5); }

.node-name {
  font-size: 11px; font-weight: 500; line-height: 1.25;
  color: var(--tx3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.node.available .node-name { color: var(--tx0); }
.node.completed .node-name { color: var(--a); }
.node.legendary.available .node-name,
.node.legendary.completed .node-name { color: var(--lg); }

.node-progress { height: 1px; background: var(--b1); margin-top: auto; border-radius: 1px; overflow: hidden; }
.node-progress-fill { height: 100%; border-radius: 1px; transition: width .3s ease; background: var(--b2); }
.node.completed .node-progress-fill { background: rgba(34,197,94,.3); }
.node.legendary.completed .node-progress-fill { background: rgba(232,160,32,.3); }

/* Root node */
.node.root {
  width: 100px; height: 30px; border-radius: 15px;
  background: var(--s4); border-color: var(--b2);
  align-items: center; justify-content: center;
  flex-direction: row; padding: 0;
}
.node.root .node-name {
  font-size: 10px; font-weight: 600; color: var(--tx2);
  letter-spacing: .08em; text-transform: uppercase;
  text-align: center; flex: none;
}

/* Category dot colors */
.cat-push { background: #6e8cfb; }
.cat-pull { background: var(--a); }
.cat-core { background: #f97316; }
.cat-legs { background: #a78bfa; }
.cat-balance { background: #38bdf8; }

/* Category label */
.cat-label {
  position: absolute;
  font-family: var(--fm); font-size: 9px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--tx3); pointer-events: none; white-space: nowrap;
}

/* ─── BRANCH LINES ──────────────────────────── */
.branch { stroke: var(--b1); stroke-width: 1; fill: none; }
.branch.unlocked { stroke: rgba(46,204,113,.25); }
.branch.available { stroke: rgba(255,255,255,.07); }
.branch.legendary-line { stroke: rgba(232,160,32,.15); }

/* ─── ZOOM CONTROLS ─────────────────────────── */
#zoom-ctrl {
  position: fixed; bottom: 20px; right: 20px; z-index: 200;
  display: flex; flex-direction: column; gap: 4px;
}
.z-btn {
  width: 32px; height: 32px; border-radius: var(--r2);
  background: var(--s3); border: 1px solid var(--b1);
  color: var(--tx2); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; font-family: var(--f);
}
.z-btn:hover { border-color: var(--b2); color: var(--tx0); background: var(--s4); }

/* ─── MODAL ─────────────────────────────────── */
#modal-bg {
  display: none; position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 16px;
}
#modal-bg.open { display: flex; animation: bgFadeIn .15s ease; }
@keyframes bgFadeIn { from { opacity: 0; } to { opacity: 1; } }

#modal {
  background: var(--s2);
  border: 1px solid var(--b2);
  border-radius: var(--r4);
  width: 100%; max-width: 440px;
  max-height: 88vh; overflow-y: auto;
  animation: modalSlide .15s ease;
  scrollbar-width: thin; scrollbar-color: var(--b1) transparent;
}
@keyframes modalSlide { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

.m-header {
  padding: 16px 16px 14px;
  border-bottom: 1px solid var(--b1);
  display: flex; align-items: flex-start; gap: 12px;
  position: sticky; top: 0; background: var(--s2); z-index: 1;
}
.m-icon {
  width: 36px; height: 36px; border-radius: var(--r2);
  background: var(--s4); border: 1px solid var(--b1);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.m-icon svg { width: 16px; height: 16px; stroke: var(--tx1); }
.m-title-group { flex: 1; min-width: 0; }
.m-title { font-size: 14px; font-weight: 600; color: var(--tx0); line-height: 1.2; margin-bottom: 3px; letter-spacing: -.01em; }
.m-subtitle { font-size: 10px; color: var(--tx2); font-family: var(--fm); letter-spacing: .07em; text-transform: uppercase; }
.m-close {
  width: 24px; height: 24px; border-radius: var(--r1);
  background: transparent; border: 1px solid var(--b1);
  color: var(--tx2); cursor: pointer; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .12s;
}
.m-close:hover { border-color: var(--b2); color: var(--tx0); background: var(--s3); }

.m-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

.m-locked {
  background: var(--s3); border: 1px solid var(--b1);
  border-radius: var(--r2); padding: 10px 12px;
  font-size: 11px; color: var(--tx2); display: flex; gap: 8px; align-items: flex-start;
}
.m-locked svg { width: 12px; height: 12px; stroke: var(--tx2); flex-shrink: 0; margin-top: 1px; }

.m-section { display: flex; flex-direction: column; gap: 8px; }
.m-label { font-size: 9px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--tx2); font-family: var(--fm); }
.m-desc { font-size: 12px; line-height: 1.65; color: var(--tx1); }

/* Video */
.m-video-wrap {
  border-radius: var(--r2); overflow: hidden;
  aspect-ratio: 16/9; background: var(--s3);
  border: 1px solid var(--b1); position: relative;
}
.m-video-wrap iframe { width: 100%; height: 100%; display: block; border: none; }
.m-video-btn {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; transition: background .15s; background: transparent;
  border: none;
}
.m-video-btn:hover { background: rgba(255,255,255,.02); }
.m-play-ring {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--b2);
  display: flex; align-items: center; justify-content: center;
}
.m-play-ring svg { width: 14px; height: 14px; stroke: var(--tx1); }
.m-video-label { font-size: 10px; color: var(--tx2); font-family: var(--fm); }
.m-yt-link {
  display: block; font-size: 10px; color: var(--tx2); font-family: var(--fm);
  text-decoration: none; padding: 2px 0;
  transition: color .12s;
}
.m-yt-link:hover { color: var(--tx1); }

/* Steps */
.step-list { display: flex; flex-direction: column; gap: 7px; }
.step-row { display: flex; gap: 10px; align-items: flex-start; }
.step-num {
  flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%;
  background: var(--s4); border: 1px solid var(--b1);
  font-size: 8px; font-family: var(--fm); color: var(--tx2);
  display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
}
.step-text { font-size: 12px; line-height: 1.55; color: var(--tx1); }

/* Requirements */
.req-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.req-chip {
  padding: 3px 8px; border-radius: var(--r1);
  font-size: 10px; font-family: var(--fm);
  display: flex; align-items: center; gap: 4px;
  border: 1px solid var(--b1); color: var(--tx2); background: var(--s3);
}
.req-chip.met { border-color: var(--a-border); color: var(--a); background: var(--a-dim); }

/* Goal card */
.goal-card {
  background: var(--s3); border: 1px solid var(--b1);
  border-radius: var(--r2); padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.goal-row { display: flex; justify-content: space-between; align-items: baseline; }
.goal-name { font-size: 12px; font-weight: 500; color: var(--tx0); }
.goal-pct { font-family: var(--fm); font-size: 10px; color: var(--tx2); }
.goal-track { height: 2px; background: var(--b1); border-radius: 1px; overflow: hidden; }
.goal-fill { height: 100%; border-radius: 1px; background: var(--tx3); transition: width .3s ease; }
.goal-hint { font-size: 10px; color: var(--tx2); font-family: var(--fm); line-height: 1.5; }

/* Log */
.log-row { display: flex; gap: 6px; align-items: center; }
.log-input {
  flex: 1; min-width: 0; background: var(--s4);
  border: 1px solid var(--b1); border-radius: var(--r1);
  padding: 7px 9px; color: var(--tx0);
  font-family: var(--fm); font-size: 12px; outline: none;
  transition: border-color .12s;
}
.log-input:focus { border-color: var(--b3); }
.log-unit { font-size: 10px; color: var(--tx2); font-family: var(--fm); white-space: nowrap; flex-shrink: 0; }
.log-btn {
  padding: 7px 12px; border-radius: var(--r1);
  border: 1px solid var(--b1); background: var(--s4);
  color: var(--tx0); font-family: var(--f); font-size: 11px;
  font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: all .12s;
}
.log-btn:hover { border-color: var(--b2); background: var(--s5); }

.log-history { display: flex; flex-direction: column; gap: 3px; max-height: 86px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--b1) transparent; }
.log-entry { display: flex; justify-content: space-between; padding: 4px 7px; border-radius: var(--r1); background: var(--s4); font-family: var(--fm); font-size: 10px; }
.log-val { color: var(--tx1); }
.log-val.good { color: var(--a); }
.log-date { color: var(--tx3); }
.log-empty { font-size: 10px; color: var(--tx3); font-family: var(--fm); }

/* Completed banner */
.done-banner {
  background: var(--a-dim); border: 1px solid var(--a-border);
  border-radius: var(--r2); padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
}
.done-banner.legendary { background: var(--lg-dim); border-color: var(--lg-border); }
.done-banner svg { width: 16px; height: 16px; stroke: var(--a); flex-shrink: 0; }
.done-banner.legendary svg { stroke: var(--lg); }
.done-text { flex: 1; }
.done-title { font-size: 12px; font-weight: 600; color: var(--a); }
.done-banner.legendary .done-title { color: var(--lg); }
.done-sub { font-size: 10px; color: var(--tx2); margin-top: 1px; font-family: var(--fm); }

/* Action buttons */
.action-btn {
  width: 100%; padding: 10px;
  border-radius: var(--r2); border: 1px solid var(--b1);
  background: var(--s3); color: var(--tx2);
  font-family: var(--f); font-size: 12px; font-weight: 500;
  cursor: not-allowed; transition: all .12s; text-align: center;
}
.action-btn.ready {
  border-color: var(--b2); background: var(--s4);
  color: var(--tx0); cursor: pointer;
}
.action-btn.ready:hover { border-color: var(--b3); background: var(--s5); }
.action-btn.ghost {
  background: transparent; border-color: var(--b1);
  color: var(--tx2); cursor: pointer;
}
.action-btn.ghost:hover { color: var(--tx1); border-color: var(--b2); }

/* ─── COACH PANEL ────────────────────────────── */
#coach-panel {
  position: fixed; top: var(--hdr-h); right: 0; bottom: 0;
  width: 360px;
  background: var(--s1);
  border-left: 1px solid var(--b1);
  display: flex; flex-direction: column;
  z-index: 250;
  transform: translateX(100%);
  transition: transform .2s ease;
}
#coach-panel.open { transform: translateX(0); }

.cp-top {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--b1);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.cp-title { font-size: 12px; font-weight: 600; color: var(--tx0); letter-spacing: -.01em; }
.cp-key-status {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--fm); font-size: 10px; color: var(--tx2);
}
.cp-key-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--tx3); }
.cp-key-dot.active { background: var(--a); }
.cp-key-btn {
  padding: 3px 8px; border-radius: var(--r1);
  border: 1px solid var(--b1); background: transparent;
  color: var(--tx2); font-size: 10px; font-family: var(--fm);
  cursor: pointer; transition: all .12s;
}
.cp-key-btn:hover { border-color: var(--b2); color: var(--tx1); }

.cp-messages {
  flex: 1; overflow-y: auto; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  scrollbar-width: thin; scrollbar-color: var(--b1) transparent;
}
.cp-msg { max-width: 90%; display: flex; flex-direction: column; gap: 3px; }
.cp-msg.user { align-self: flex-end; }
.cp-msg.ai { align-self: flex-start; }
.cp-bubble {
  padding: 9px 11px; border-radius: var(--r2);
  font-size: 12px; line-height: 1.6;
}
.cp-msg.user .cp-bubble {
  background: var(--s4); border: 1px solid var(--b1); color: var(--tx0);
}
.cp-msg.ai .cp-bubble {
  background: var(--s2); border: 1px solid var(--b1); color: var(--tx1);
}
.cp-bubble.loading { color: var(--tx2); }
.cp-time { font-size: 9px; color: var(--tx3); font-family: var(--fm); padding: 0 2px; }

.cp-bottom {
  padding: 12px;
  border-top: 1px solid var(--b1);
  display: flex; flex-direction: column; gap: 8px;
  flex-shrink: 0;
}
.cp-quick { display: flex; flex-wrap: wrap; gap: 5px; }
.cp-quick-btn {
  padding: 4px 9px; border-radius: var(--r1);
  border: 1px solid var(--b1); background: transparent;
  color: var(--tx2); font-size: 10px; cursor: pointer;
  transition: all .12s; font-family: var(--f);
}
.cp-quick-btn:hover { border-color: var(--b2); color: var(--tx1); background: var(--s3); }
.cp-input-row { display: flex; gap: 6px; }
.cp-textarea {
  flex: 1; background: var(--s3); border: 1px solid var(--b1);
  border-radius: var(--r2); padding: 8px 10px;
  color: var(--tx0); font-family: var(--f); font-size: 12px;
  outline: none; resize: none; height: 36px;
  transition: border-color .12s;
}
.cp-textarea:focus { border-color: var(--b2); }
.cp-send {
  padding: 8px 12px; border-radius: var(--r2);
  border: 1px solid var(--b1); background: var(--s3);
  color: var(--tx1); font-size: 11px; cursor: pointer;
  transition: all .12s; font-family: var(--f);
}
.cp-send:hover { border-color: var(--b2); color: var(--tx0); }
.cp-send:disabled { opacity: .4; cursor: not-allowed; }

/* ─── TOAST ─────────────────────────────────── */
#toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(50px);
  opacity: 0; pointer-events: none; z-index: 600;
  background: var(--s4); border: 1px solid var(--b2);
  border-radius: var(--r2); padding: 8px 14px;
  font-size: 11px; color: var(--tx1); font-family: var(--fm);
  white-space: nowrap; transition: all .2s ease;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ─── MOBILE ─────────────────────────────────── */
@media (max-width: 700px) {
  :root { --hdr-h: 44px; }
  #hdr { padding: 0 12px; gap: 0; }
  .h-brand { margin-right: 12px; }
  .h-divider:first-of-type { display: none; }
  .h-stat-group { gap: 8px; }
  .h-stat-lbl { display: none; }
  .h-level-label { display: none; }
  .h-xp-track { width: 32px; }

  #canvas-wrap { touch-action: none; }

  #coach-panel {
    width: 100%; height: 65vh;
    top: auto; bottom: 0;
    border-left: none;
    border-top: 1px solid var(--b1);
    border-radius: var(--r4) var(--r4) 0 0;

  }
  #coach-panel.open { transform: translateY(0); }
  #canvas-wrap.coach-open { right: 0; }

  #modal { max-width: 100%; border-radius: var(--r4) var(--r4) 0 0; max-height: 90vh; }

  #zoom-ctrl { bottom: 14px; right: 12px; }
  .z-btn { width: 28px; height: 28px; font-size: 13px; }
}

const SKILL_MAP=Object.fromEntries(SKILLS.map(s=>[s.id,s]));

function getProgress(skill){
  if(isCompleted(skill.id))return 1;
  const g=skill.goal,logs=STATE.logs[skill.id]||[];
  if(g.type==='unlock')return 1;
  if(g.type==='time'){const best=logs.reduce((m,l)=>Math.max(m,l.val),0);return Math.min(1,best/g.value);}
  if(g.type==='sets'){const q=logs.filter(l=>l.val>=g.reps).length;return Math.min(1,q/g.sets);}
  return 0;
}
function isGoalMet(skill){
  if(isCompleted(skill.id))return true;
  if(skill.goal.type==='unlock')return true;
  return getProgress(skill)>=1;
}
function getProgressHint(skill){
  const g=skill.goal,logs=STATE.logs[skill.id]||[];
  if(g.type==='time'){const b=logs.reduce((m,l)=>Math.max(m,l.val),0);return `Best single hold: ${b}s  \xb7  Need: ${g.value}s`;}
  if(g.type==='sets'){const q=logs.filter(l=>l.val>=g.reps).length;return `${q}/${g.sets} qualifying sets  \xb7  Need \u2265${g.reps} reps each`;}
  return'';
}

const DB_KEY='cali_v6';
let STATE={completed:['root'],xp:0,logs:{}};
let _completedSet=new Set(['root']);
let _syncTimer=null;
try{
  const s=JSON.parse(localStorage.getItem(DB_KEY));
  if(s&&Array.isArray(s.completed)){STATE=s;}
  if(!STATE.logs)STATE.logs={};
  if(!STATE.completed.includes('root'))STATE.completed.push('root');
  _completedSet=new Set(STATE.completed);
}catch(e){}

function saveState(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(STATE));}catch(e){}
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(syncToFirebase,3000);
}
function isCompleted(id){return _completedSet.has(id);}
function isAvailable(skill){
  if(skill.id==='root')return true;
  return skill.requires.every(r=>isCompleted(r));
}
function getStatus(skill){
  if(isCompleted(skill.id))return'completed';
  if(isAvailable(skill))return'available';
  return'locked';
}

const cWrap=document.getElementById('canvas-wrap');
const cEl=document.getElementById('canvas');
const svgEl=document.getElementById('tree-svg');
const nodesEl=document.getElementById('tree-nodes');
let cam={x:0,y:0,z:1},drag={on:false,sx:0,sy:0,cx:0,cy:0},pinchDist=0,_rafId=null;

cEl.style.width=CW+'px';cEl.style.height=CH+'px';

function applyCam(){
  if(_rafId)return;
  _rafId=requestAnimationFrame(()=>{
    cEl.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
    _rafId=null;
  });
}
function zoomTo(nz,px,py){
  nz=Math.min(3,Math.max(0.12,nz));
  cam.x=px-(px-cam.x)/cam.z*nz;
  cam.y=py-(py-cam.y)/cam.z*nz;
  cam.z=nz;applyCam();
}
function resetCam(){
  const vw=cWrap.clientWidth,vh=cWrap.clientHeight;
  const z=Math.min(0.88,vw/(CW+60),vh/(CH+60));
  cam.x=Math.round((vw-CW*z)/2);cam.y=Math.round((vh-CH*z)/2);cam.z=z;applyCam();
}
cWrap.addEventListener('mousedown',e=>{
  if(e.target.closest('.node'))return;
  drag={on:true,sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};
  cWrap.classList.add('panning');
});
window.addEventListener('mousemove',e=>{if(!drag.on)return;cam.x=drag.cx+(e.clientX-drag.sx);cam.y=drag.cy+(e.clientY-drag.sy);applyCam();});
window.addEventListener('mouseup',()=>{drag.on=false;cWrap.classList.remove('panning');});
cWrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cWrap.getBoundingClientRect();
  zoomTo(cam.z*(e.deltaY<0?1.1:0.91),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
cWrap.addEventListener('touchstart',e=>{
  if(e.touches.length===1)drag={on:true,sx:e.touches[0].clientX,sy:e.touches[0].clientY,cx:cam.x,cy:cam.y};
  else if(e.touches.length===2){drag.on=false;pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
cWrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&drag.on){cam.x=drag.cx+(e.touches[0].clientX-drag.sx);cam.y=drag.cy+(e.touches[0].clientY-drag.sy);applyCam();}
  else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const r=cWrap.getBoundingClientRect();
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    const my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    zoomTo(cam.z*d/pinchDist,mx,my);pinchDist=d;
  }
},{passive:false});
cWrap.addEventListener('touchend',()=>{drag.on=false;});
document.getElementById('z-in').onclick=()=>zoomTo(cam.z*1.2,cWrap.clientWidth/2,cWrap.clientHeight/2);
document.getElementById('z-out').onclick=()=>zoomTo(cam.z/1.2,cWrap.clientWidth/2,cWrap.clientHeight/2);
document.getElementById('z-rst').onclick=resetCam;

function buildTree(){
  svgEl.innerHTML='';
  nodesEl.innerHTML='';
  const CAT_COLS={push:215,pull:630,core:1020,legs:1390,balance:1760};
  Object.entries(CAT_COLS).forEach(([cat,cx])=>{
    const d=document.createElement('div');d.className='cat-label';
    d.textContent=CAT_NAME[cat];d.style.cssText=`left:${cx}px;top:${TY[0]+ROOT_H+8}px;`;
    nodesEl.appendChild(d);
  });
  SKILLS.forEach(skill=>{
    skill.requires.forEach(reqId=>{
      const req=SKILL_MAP[reqId];if(!req)return;
      const cx2=skill.x+NW/2,cy2=TY[skill.tier]+NH;
      const cx1=req.id==='root'?req.x+ROOT_W/2:req.x+NW/2;
      const cy1=req.id==='root'?TY[0]:TY[req.tier];
      const midY=(cy1+cy2)/2;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M ${cx2} ${cy2} L ${cx2} ${midY} L ${cx1} ${midY} L ${cx1} ${cy1}`);
      path.setAttribute('fill','none');
      let cls='branch';
      if(isCompleted(skill.id)&&isCompleted(reqId))cls+=' unlocked';
      else if(isAvailable(skill)&&isCompleted(reqId))cls+=' available';
      else if(skill.legendary||req.legendary)cls+=' legendary-line';
      path.setAttribute('class',cls);svgEl.appendChild(path);
    });
  });
  SKILLS.forEach(skill=>{
    const y=TY[skill.tier];
    const n=document.createElement('div');
    if(skill.id==='root'){
      n.className='node root';n.style.cssText=`left:${skill.x}px;top:${y}px;width:${ROOT_W}px;height:${ROOT_H}px;`;
      n.innerHTML=`<span class="node-name">Calitree</span>`;
      nodesEl.appendChild(n);return;
    }
    const st=getStatus(skill),prog=getProgress(skill);
    let cls=`node ${st}`;if(skill.legendary)cls+=' legendary';
    n.className=cls;n.id=`node-${skill.id}`;
    n.style.cssText=`left:${skill.x}px;top:${y}px;`;
    const badge=st==='completed'?(skill.legendary?'\u2605':'\u2713'):st==='available'?'ready':'';
    n.innerHTML=`<div class="node-header"><div class="node-cat" style="background:${CAT_DOT[skill.cat]||'#666'}"></div><span class="node-badge">${badge}</span></div><div class="node-name">${skill.name}</div><div class="node-progress"><div class="node-progress-fill" style="width:${Math.round(prog*100)}%"></div></div>`;
    n.addEventListener('click',()=>openModal(skill.id));
    nodesEl.appendChild(n);
  });
}

function updateHeader(){
  const done=STATE.completed.filter(id=>id!=='root').length;
  document.getElementById('h-done').textContent=done;
  document.getElementById('h-total').textContent=SKILLS.length-1;
  document.getElementById('h-xp').textContent=STATE.xp;
  let xp=STATE.xp,lv=1;
  const req=l=>100+(l-1)*75;
  while(xp>=req(lv)){xp-=req(lv);lv++;}
  document.getElementById('h-lvl').textContent=lv;
  document.getElementById('h-xp-fill').style.width=Math.round(xp/req(lv)*100)+'%';
}

let _curSkill=null;
function openModal(id){
  _curSkill=id;const skill=SKILL_MAP[id];if(!skill)return;
  const st=getStatus(skill),isDone=isCompleted(id),isAvail=isAvailable(skill),isLocked=st==='locked';
  const iconEl=document.getElementById('m-icon');
  iconEl.style.background=isDone?'var(--a-dim)':skill.legendary?'var(--lg-dim)':'';
  document.getElementById('m-title').textContent=skill.name;
  document.getElementById('m-title').style.color=isDone?(skill.legendary?'var(--lg)':'var(--a)'):'var(--tx0)';
  document.getElementById('m-subtitle').textContent=`${CAT_NAME[skill.cat]||skill.cat}  \xb7  ${skill.legendary?'\u2605 Legendary':'Tier '+skill.tier}`;
  const body=document.getElementById('m-body');body.innerHTML='';
  if(isLocked){
    const reqNames=skill.requires.filter(r=>!isCompleted(r)).map(r=>{const s=SKILL_MAP[r];return s?s.name:r;});
    const el=mk('div','m-locked');
    el.innerHTML=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="7" width="8" height="7" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>Complete first: ${reqNames.join(', ')}`;
    body.appendChild(el);
  }
  if(skill.desc)body.appendChild(mksec([mklbl('About'),mktx('p','m-desc',skill.desc)]));
  if(skill.youtubeId){
    const ytId=skill.youtubeId;
    const vw=mk('div','m-video-wrap');
    const btn=mk('button','m-video-btn');
    btn.innerHTML=`<div class="m-play-ring"><svg viewBox="0 0 16 16" fill="none"><polygon points="5,2 14,8 5,14" fill="currentColor"/></svg></div><span class="m-video-label">Watch tutorial</span>`;
    btn.addEventListener('click',()=>{vw.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1" allowfullscreen allow="autoplay;encrypted-media"></iframe>`;});
    vw.appendChild(btn);body.appendChild(vw);
    const link=mk('a','m-yt-link');link.href=`https://www.youtube.com/watch?v=${ytId}`;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open on YouTube \u2192';
    body.appendChild(link);
  }
  if(skill.steps&&skill.steps.length){
    const list=mk('div','step-list');
    skill.steps.forEach((s,i)=>{const row=mk('div','step-row');row.appendChild(mktx('div','step-num',String(i+1)));row.appendChild(mktx('div','step-text',s));list.appendChild(row);});
    body.appendChild(mksec([mklbl('How to do it'),list]));
  }
  if(skill.requires.length){
    const chips=mk('div','req-chips');
    skill.requires.forEach(r=>{const rs=SKILL_MAP[r];const met=isCompleted(r);chips.appendChild(mktx('span',`req-chip${met?' met':''}`,`${met?'\u2713 ':'○ '}${rs?rs.name:r}`));});
    body.appendChild(mksec([mklbl('Requires'),chips]));
  }
  if(skill.goal.type!=='unlock'&&!isLocked)body.appendChild(buildGoalCard(skill,isDone));
  if(isDone){
    const banner=mk('div',`done-banner${skill.legendary?' legendary':''}`);
    banner.innerHTML=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,8 6.5,11.5 13,5"/></svg><div class="done-text"><div class="done-title">${skill.legendary?'Legendary achieved':'Skill completed'}</div><div class="done-sub">+${skill.xp} xp earned</div></div>`;
    body.appendChild(banner);
    const undo=mktx('button','action-btn ghost','\u21a9 Mark as not completed');
    undo.onclick=()=>{undoSkill(id);closeModal();};body.appendChild(undo);
  }else if(isAvail){
    const met=isGoalMet(skill);
    const btn=mktx('button',`action-btn${met?' ready':''}`,met?`Mark complete  \xb7  +${skill.xp} xp`:'Log progress above to unlock');
    if(met)btn.onclick=()=>completeSkill(id);body.appendChild(btn);
  }else{
    body.appendChild(mktx('button','action-btn','Complete requirements to unlock'));
  }
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('modal').scrollTop=0;
}

function buildGoalCard(skill,isDone){
  const g=skill.goal,prog=getProgress(skill),pct=Math.round(Math.min(1,prog)*100);
  const logs=(STATE.logs[skill.id]||[]).slice().reverse().slice(0,8);
  const unit=g.type==='time'?'sec':'reps',ph=g.type==='time'?String(g.value):String(g.reps);
  const card=mk('div','goal-card');
  const row=mk('div','goal-row');
  row.appendChild(mktx('span','goal-name',`Goal: ${g.label}`));
  row.appendChild(mktx('span','goal-pct',`${pct}%`));card.appendChild(row);
  const track=mk('div','goal-track');const fill=mk('div','goal-fill');
  fill.style.width=pct+'%';
  if(pct>=100)fill.style.background='var(--a)';
  else if(pct>40)fill.style.background='var(--tx2)';
  track.appendChild(fill);card.appendChild(track);
  const hint=getProgressHint(skill);if(hint)card.appendChild(mktx('div','goal-hint',hint));
  if(!isDone){
    const ls=mksec([mklbl('Log a session')]);
    const lr=mk('div','log-row');
    const inp=mk('input','log-input');inp.type='number';inp.min='1';inp.placeholder=ph;inp.id=`log-${skill.id}`;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')addLog(skill.id);});
    lr.appendChild(inp);lr.appendChild(mktx('span','log-unit',unit));
    const btn=mktx('button','log-btn','Log');btn.onclick=()=>addLog(skill.id);lr.appendChild(btn);
    ls.appendChild(lr);card.appendChild(ls);
  }
  const hs=mksec([mklbl('Session history')]);
  const hist=mk('div','log-history');
  if(!logs.length)hist.appendChild(mktx('div','log-empty','No sessions logged yet'));
  else logs.forEach(log=>{
    const entry=mk('div','log-entry');
    const good=g.type==='sets'?log.val>=g.reps:log.val>=g.value;
    entry.appendChild(mktx('span',good?'log-val good':'log-val',`${log.val} ${unit}`));
    entry.appendChild(mktx('span','log-date',fmtDate(log.ts)));
    hist.appendChild(entry);
  });
  hs.appendChild(hist);card.appendChild(hs);return card;
}

function addLog(id){
  const skill=SKILL_MAP[id];if(!skill||isCompleted(id))return;
  const inp=document.getElementById(`log-${id}`);
  const val=parseFloat(inp.value);if(!val||val<=0){inp.focus();return;}
  if(!STATE.logs[id])STATE.logs[id]=[];
  STATE.logs[id].push({val,ts:Date.now()});saveState();inp.value='';
  const g=skill.goal;let msg;
  if(g.type==='time')msg=val>=g.value?`${val}s \u2014 goal reached!`:`${val}s logged \xb7 need ${g.value}s in one hold`;
  else{const q=STATE.logs[id].filter(l=>l.val>=g.reps).length;msg=val>=g.reps?`Set ${q}/${g.sets} qualifying`:`${val} reps \xb7 need \u2265${g.reps}`;}
  showToast(msg);openModal(id);buildTree();
}
function completeSkill(id){
  const skill=SKILL_MAP[id];if(!skill||isCompleted(id))return;
  STATE.completed.push(id);_completedSet.add(id);STATE.xp+=skill.xp;
  saveState();showToast(`${skill.name} complete \xb7 +${skill.xp} xp`);
  closeModal();buildTree();updateHeader();
}
function undoSkill(id){
  const skill=SKILL_MAP[id];if(!skill)return;
  STATE.completed=STATE.completed.filter(c=>c!==id);_completedSet.delete(id);
  STATE.xp=Math.max(0,STATE.xp-skill.xp);saveState();buildTree();updateHeader();
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');_curSkill=null;}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target===document.getElementById('modal-bg'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

let coachOpen=false;
const GROQ_URL='https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL='llama-3.3-70b-versatile';
function getApiKey(){return localStorage.getItem('cali_groq_key')||'';}
function setApiKey(k){localStorage.setItem('cali_groq_key',k);}
function updateKeyStatus(){
  const k=getApiKey();
  const dot=document.getElementById('cp-dot');const lbl=document.getElementById('cp-key-lbl');
  if(k){dot.classList.add('active');lbl.textContent='Key set';}
  else{dot.classList.remove('active');lbl.textContent='No key';}
}
function promptApiKey(){
  const k=prompt('Enter your Groq API key (free at console.groq.com):');
  if(k&&k.trim()){setApiKey(k.trim());updateKeyStatus();showToast('API key saved');}
}
function toggleCoach(){
  coachOpen=!coachOpen;
  document.getElementById('coach-panel').classList.toggle('open',coachOpen);
  document.getElementById('coach-toggle').classList.toggle('active',coachOpen);
  if(window.innerWidth>700)document.getElementById('canvas-wrap').classList.toggle('coach-open',coachOpen);
}
function buildCoachCtx(){
  const done=STATE.completed.filter(id=>id!=='root');
  const avail=SKILLS.filter(s=>!isCompleted(s.id)&&s.id!=='root'&&isAvailable(s));
  let lv=1,xp=STATE.xp;const req=l=>100+(l-1)*75;
  while(xp>=req(lv)){xp-=req(lv);lv++;}
  const names=done.map(id=>{const s=SKILL_MAP[id];return s?s.name:id;}).join(', ')||'none';
  return `You are an expert calisthenics coach in Calitree.
User: Level ${lv}, ${STATE.xp} XP. Completed (${done.length}): ${names}.
Available next: ${avail.map(s=>s.name).join(', ')||'none'}.
Be concise (max 150 words), specific, encouraging.`;
}
// Chat history — saved to localStorage, restored on load
const CHAT_KEY='cali_chat_v1';
let _coachHist=[];
try{
  const saved=JSON.parse(localStorage.getItem(CHAT_KEY));
  if(Array.isArray(saved))_coachHist=saved;
}catch(e){}

function saveChatHistory(){
  try{localStorage.setItem(CHAT_KEY,JSON.stringify(_coachHist.slice(-40)));}catch(e){}
}

function clearChat(){
  _coachHist=[];
  saveChatHistory();
  const msgs=document.getElementById('cp-messages');
  msgs.innerHTML='';
  const welcome=mk('div','cp-msg ai');
  welcome.appendChild(mktx('div','cp-bubble','Chat cleared. Ask me anything about your training!'));
  msgs.appendChild(welcome);
}

function restoreChatUI(){
  if(!_coachHist.length)return;
  const msgs=document.getElementById('cp-messages');
  // Keep the initial welcome message, then append history
  _coachHist.forEach(msg=>{
    if(msg.role==='user'||msg.role==='assistant'){
      const w=mk('div',`cp-msg ${msg.role==='user'?'user':'ai'}`);
      const b=mktx('div','cp-bubble',msg.content);
      w.appendChild(b);msgs.appendChild(w);
    }
  });
  msgs.scrollTop=msgs.scrollHeight;
}
async function sendCoach(){
  const inp=document.getElementById('cp-inp');const msg=inp.value.trim();if(!msg)return;
  const key=getApiKey();if(!key){promptApiKey();return;}
  inp.value='';addChatMsg('user',msg);
  const typing=addChatMsg('ai','\u2026',true);
  document.getElementById('cp-send').disabled=true;
  _coachHist.push({role:'user',content:msg});
  saveChatHistory();
  try{
    const res=await fetch(GROQ_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:GROQ_MODEL,messages:[{role:'system',content:buildCoachCtx()},..._coachHist],max_tokens:350,temperature:0.7})});
    if(!res.ok){const err=await res.json();throw new Error(err.error?.message||`HTTP ${res.status}`);}
    const data=await res.json();const reply=data.choices?.[0]?.message?.content||'No response';
    _coachHist.push({role:'assistant',content:reply});
    if(_coachHist.length>40)_coachHist=_coachHist.slice(-40);
    saveChatHistory();
    typing.querySelector('.cp-bubble').textContent=reply;typing.querySelector('.cp-bubble').classList.remove('loading');
  }catch(e){typing.querySelector('.cp-bubble').textContent=`Error: ${e.message}`;}
  document.getElementById('cp-send').disabled=false;
  const msgs=document.getElementById('cp-messages');msgs.scrollTop=msgs.scrollHeight;
}
function addChatMsg(role,text,isLoading=false){
  const msgs=document.getElementById('cp-messages');
  const w=mk('div',`cp-msg ${role}`);
  const b=mktx('div',`cp-bubble${isLoading?' loading':''}`,text);
  const t=mktx('span','cp-time',new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  w.appendChild(b);w.appendChild(t);msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight;return w;
}
function quickMsg(m){document.getElementById('cp-inp').value=m;sendCoach();}
function cpKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCoach();}}

let _fb={auth:null,db:null,user:null,ready:false};
async function initFirebaseApp(){
  try{
    const[{initializeApp},{getAuth,onAuthStateChanged},{getFirestore,doc,getDoc,setDoc}]=await Promise.all([import('https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js')]);
    const app=initializeApp(FIREBASE_CONFIG);
    _fb.auth=getAuth(app);_fb.db=getFirestore(app);_fb.doc=doc;_fb.getDoc=getDoc;_fb.setDoc=setDoc;_fb.ready=true;
    onAuthStateChanged(_fb.auth,async user=>{
      _fb.user=user;
      if(user){const name=user.displayName||user.email.split('@')[0];document.getElementById('h-username').textContent=name;await loadFromFirebase(user.uid);}
      else{const u=localStorage.getItem('cali_username');if(u)document.getElementById('h-username').textContent=u;}
    });
  }catch(e){console.warn('Firebase offline:',e.message);}
}
async function loadFromFirebase(uid){
  try{
    const snap=await _fb.getDoc(_fb.doc(_fb.db,'users',uid));
    if(snap.exists()){const remote=snap.data().progress;
      if(remote&&Array.isArray(remote.completed)&&remote.completed.length>=STATE.completed.length){STATE=remote;if(!STATE.logs)STATE.logs={};if(!STATE.completed.includes('root'))STATE.completed.push('root');_completedSet=new Set(STATE.completed);saveState();buildTree();updateHeader();}
      else await syncToFirebase();
    }
  }catch(e){console.warn('Load failed:',e.message);}
}
async function syncToFirebase(){
  if(!_fb.ready||!_fb.user)return;
  try{await _fb.setDoc(_fb.doc(_fb.db,'users',_fb.user.uid),{progress:{completed:STATE.completed,xp:STATE.xp,logs:STATE.logs}},{merge:true});}catch(e){console.warn('Sync failed:',e.message);}
}
async function handleLogout(){
  await syncToFirebase();
  if(_fb.auth&&_fb.user){const{signOut}=await import('https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js');await signOut(_fb.auth);}
  localStorage.removeItem('cali_username');window.location.href='index.html';
}

function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function mktx(tag,cls,text){const e=mk(tag,cls);e.textContent=text;return e;}
function mklbl(text){return mktx('div','m-label',text);}
function mksec(children){const s=mk('div','m-section');children.forEach(c=>s.appendChild(c));return s;}
function fmtDate(ts){return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
let _toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),2600);}

(function(){const u=localStorage.getItem('cali_username');if(u&&u!=='guest'){const el=document.getElementById('h-username');if(el)el.textContent=u;}})();
buildTree();updateHeader();updateKeyStatus();initFirebaseApp();setTimeout(resetCam,80);restoreChatUI();
